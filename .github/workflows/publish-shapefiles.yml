name: Publish shapefiles

on:
  push:
    branches: [master]
    paths:
      - "GeoJson/**"
  workflow_dispatch: {}

concurrency:
  group: publish-shapefiles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow git operations in this container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zip

      - name: Install R package dependencies
        run: Rscript -e 'install.packages("targets", repos = "https://cloud.r-project.org")'

      - name: Build shapefiles from GeoJSON
        run: Rscript -e 'targets::tar_make()'

      - name: Tag this dataset version
        id: version
        run: |
          DATE_VERSION="v$(date -u +%Y.%m.%d)"
          EXISTING=$(git ls-remote --tags origin "refs/tags/${DATE_VERSION}*" | sed 's#.*refs/tags/##' | sort -V)
          if [ -z "$EXISTING" ]; then
            VERSION="$DATE_VERSION"
          else
            LAST=$(echo "$EXISTING" | tail -1)
            if [ "$LAST" = "$DATE_VERSION" ]; then
              N=2
            else
              N=$(( $(echo "$LAST" | sed "s/^${DATE_VERSION}\.//") + 1 ))
            fi
            VERSION="${DATE_VERSION}.${N}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git tag "$VERSION" "${{ github.sha }}"
          git push origin "$VERSION"

      - name: Create/update the rolling "latest" release (no assets yet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-shapefiles
          name: Shapefiles (auto-updated)
          body: |
            Shapefiles regenerated from `GeoJson/` at commit ${{ github.sha }}
            (dataset version ${{ steps.version.outputs.version }}).
            Each zip contains a VERSION.txt recording the exact source commit.
            This release is overwritten automatically whenever GeoJson/ changes
            on master. The commit itself is permanently tagged
            `${{ steps.version.outputs.version }}` for reference, but no
            separate asset archive is kept per version -- check out that tag
            and rebuild via `targets::tar_make()` to reproduce it exactly.

      - name: Split shapefiles into upload batches
        run: |
          mkdir -p ShapeFiles/batch1 ShapeFiles/batch2 ShapeFiles/batch3 ShapeFiles/batch4
          i=0
          for f in ShapeFiles/districts*.zip; do
            batch=$(( (i % 4) + 1 ))
            mv "$f" "ShapeFiles/batch${batch}/"
            i=$((i + 1))
          done

      # GitHub's API applies a secondary rate limit to bursts of asset
      # uploads; uploading all ~119 zips in one shot intermittently trips it.
      # Uploading in smaller batches with a pause between each keeps every
      # individual burst well under that limit.
      - name: Upload shapefile batch 1/4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-shapefiles
          files: ShapeFiles/batch1/*.zip

      - name: Pause between batches
        run: sleep 30

      - name: Upload shapefile batch 2/4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-shapefiles
          files: ShapeFiles/batch2/*.zip

      - name: Pause between batches
        run: sleep 30

      - name: Upload shapefile batch 3/4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-shapefiles
          files: ShapeFiles/batch3/*.zip

      - name: Pause between batches
        run: sleep 30

      - name: Upload shapefile batch 4/4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-shapefiles
          files: ShapeFiles/batch4/*.zip
